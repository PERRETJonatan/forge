server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # env.js (see docker/40-env-js.sh) is regenerated on every container start;
    # a cached stale copy would defeat that, so never let browsers cache it.
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # env.js defaults apiUrl to /api; the API itself mounts its routes at the
    # root, so strip the prefix.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
