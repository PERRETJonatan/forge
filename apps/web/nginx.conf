server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Every location below includes /etc/nginx/security-headers.conf (written at container start
    # by docker/40-env-js.sh): nginx drops server-level add_header lines in any location that sets
    # its own, so the security headers are repeated per location instead.

    # env.js and theme-init.js aren't content-hashed, and env.js is regenerated on every
    # container start (see docker/40-env-js.sh) -- never let browsers cache a stale copy.
    location = /env.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /theme-init.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The app shell: always revalidated, so a redeploy is picked up on the next load instead of
    # an old shell asking for code files that no longer exist.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Build output with a content hash in the name (main-SHSFT6JX.js, chunk-…, styles-…):
    # safe to cache forever, since any change gets a new name.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # env.js defaults apiUrl to /api; the API itself mounts its routes at the
    # root, so strip the prefix. The API sets its own security headers (helmet).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API rate-limits per client IP, read from here (see TRUST_PROXY in the API's env).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Plan imports are capped at 5 MB by the API; leave room for the multipart envelope.
        client_max_body_size 6m;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
