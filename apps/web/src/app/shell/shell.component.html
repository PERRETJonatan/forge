<div class="shell">
  <!-- Phones only: the sidebar collapses into a drawer this bar opens. -->
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="logo.svg" alt="" />
      <span>Forge</span>
    </div>
    <button
      type="button"
      class="menu-toggle"
      aria-controls="sidebar"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      (click)="menuOpen.set(!menuOpen())"
    >
      <span class="menu-icon" [class.open]="menuOpen()" aria-hidden="true"></span>
    </button>
  </header>

  @if (menuOpen()) {
    <div class="scrim" (click)="menuOpen.set(false)"></div>
  }

  <aside id="sidebar" class="sidebar" [class.open]="menuOpen()">
    <div class="brand">
      <img class="logo" src="logo.svg" alt="" />
      <span>Forge</span>
    </div>

    <nav (click)="menuOpen.set(false)">
      <a routerLink="/calendar" routerLinkActive="active">Calendar</a>
      <a routerLink="/builder" routerLinkActive="active">Builder</a>
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/coach" routerLinkActive="active">Coach</a>
      <a routerLink="/glossary" routerLinkActive="active">Glossary</a>
      <a routerLink="/settings" routerLinkActive="active">Settings</a>
    </nav>

    <div class="theme" role="radiogroup" aria-label="Theme">
      @for (option of themeOptions; track option.value) {
        <button
          type="button"
          role="radio"
          [class.active]="themeService.preference() === option.value"
          [attr.aria-checked]="themeService.preference() === option.value"
          (click)="themeService.set(option.value)"
        >
          {{ option.label }}
        </button>
      }
    </div>

    <div class="account">
      <div class="avatar">{{ (authService.athlete()?.name ?? '?').charAt(0) }}</div>
      <div class="account-info">
        <span class="account-name">{{ authService.athlete()?.name }}</span>
        <button type="button" class="logout" (click)="logout()">Log out</button>
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
