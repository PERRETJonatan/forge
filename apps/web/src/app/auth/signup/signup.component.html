<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="auth-brand">
      <div class="auth-logo">F</div>
      <span>Forge</span>
    </div>
    <h1>Create your account</h1>
    <p class="auth-subtitle">Start tracking your training.</p>

    @if (error()) {
      <div class="auth-error">{{ error() }}</div>
    }

    <label>
      Name
      <input type="text" formControlName="name" autocomplete="name" />
    </label>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating account…' : 'Sign up' }}
    </button>

    <p class="auth-switch">Already have an account? <a routerLink="/login">Log in</a></p>
  </form>
</div>
