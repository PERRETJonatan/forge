<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Forge</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- SVG for browsers that support it (sharp at any size), .ico for the rest. -->
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="env.js"></script>
  <script>
    // Apply the saved theme before first paint so a dark-mode reload doesn't flash light.
    // Must match ThemeService's storage key and values.
    try {
      var theme = localStorage.getItem('forge.theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
